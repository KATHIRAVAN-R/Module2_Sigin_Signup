<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <style>
        body {
            background:
                linear-gradient(120deg,
                    rgba(255, 120, 24, 0.5),
                    rgba(246, 247, 251, 0.808)),
                url(https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80),
                center / cover;
            height: 100%;
            padding: 2rem 0;
        }

        .signup_form {
            font-family: 'Courier New', Courier, monospace;
            color: #ff7a18;
            width: 80%;
            margin: auto;
            background-color: rgba(255, 255, 255, 0.247);
            border-radius: 1rem;
            padding: 1rem 0;
            box-shadow: 2px 10px 20px #63615fe0;
        }

        .signup_form h3 {
            text-align: center;
            font-weight: bolder;
            text-shadow: 4px 4px 4px #b98159a1;
        }

        .form {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(255, 255, 255, 0.808);
            padding: 1rem;
            display: flex;
            justify-content: center;
        }

        input[type] {
            padding: 2px;
            margin: 5px;
            font-weight: bold;
            box-shadow: 0 22px 50px rgba(20, 30, 55, 0.322);
            border-radius: 10px;
            color: #ff7a18;
        }

        .form input {
            color: #ff7a18;

        }

        input[type="submit"] {
            background-color: #ff7a18;
            color: white;
        }

        input[type="submit"]:hover {
            background-color: white;
            color: #ff7a18;

        }

        .check {
            display: flex;
            justify-content: end;

        }

        .check a {
            text-decoration: none;
            color: #ef4b0f;
            font-size: small;

        }
    </style>
</head>

<body>
    <main class="signup_main">
        <div class="signup_form container">
            <h3>Sign Up</h3>
            <form class="form row" action="action.html">
                <div class="email in ">
                    <label for="exampleInputEmail1" class="form-label">Name</label>
                    <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"
                        required>
                </div>
                <div class="email in ">
                    <label for="exampleInputEmail1" class="form-label">Phone</label>
                    <input type="number" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"
                        required>
                </div>
                <div class="email in ">
                    <label for="exampleInputEmail1" class="form-label">Email</label>
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"
                        required>
                </div>
                <div class="password in">
                    <label for="exampleInputPassword1" class="form-label">Password</label>
                    <input type="password" class="form-control" id="exampleInputPassword1" required>
                </div>
                <div class="password in">
                    <label for="exampleInputPassword1" class="form-label">confirm Password</label>
                    <input type="password" class="form-control" id="exampleInputPassword1" required>
                </div>
                <div class="submit in">
                    <input type="submit" class="btn in form-control" value="Submit">
                </div>

                <div class="check">
                    <span><a href="signin.html">Sign In</a></span>
                </div>
            </form>
        </div>

    </main>

</body>

</html>
