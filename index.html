<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="css/index.css" type="text/css">
</head>
<body>
    <h1>Kathir</h1>
   <form id="signupform" onsubmit="return validateForm()">
    <h2>Sign Up</h2>
    <label>FullName:</label>
    <input type="text" id="fullname" name="fname" placeholder="Enter your name" value=""/>
    <span id="name-error" class="error-message"></span>
    <br>
    <label>Email:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" value=""/>
    <span id="email-error" class="error-message"></span>
    <br>
    <label>Phone number:</label>
    <input type="text" id="phone" name="phone" placeholder="Enter your mobile number" value=""/>
    <span id="phone-error" class="error-message"></span>
    <br>
    <label>Location:</label>
    <input type="text" id="location" name="location" placeholder="Enter your Location" value=""/>
    <span id="location-error" class="error-message"></span>
    <br>
    <div class="password-box">
    <label>Password:</label>
    <input type="password"id="pwd" name="pwd" placeholder="Enter your password" value=""/>
    <button type="button" onclick="togglePassword()">Show</button>
    <span id="password-error" class="error-message"></span>
    </div>
    <br>
    <div class="password-box">
    <label>Confirm Password:</label>
    <input type="password" id="cpwd"name="cpwd" placeholder="Enter password" value=""/>
    <button type="button" onclick="toggleConfirmPassword()">Show</button>
    <span id="confirm-error" class="error-message"></span>
    <br>
    </div>
    <div class="btn-container">
    <button type="submit" id="signupbtn">Sign Up</button>
</div>
    <p>
    Already have an account?
    <a href="SignIn.html">Sign In</a>
</p>
    </form>
    <script src="js/index.js"></script>
</body>
</html>
