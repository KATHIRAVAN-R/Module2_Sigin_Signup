<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="css/index.css" type="text/css">

</head>

<body>
    <form id="signinform" onsubmit="return loginForm()">
        <h2>Sign In</h2>
        <label>Email:</label>
        <input type="email" id="loginemail" placeholder="Enter your email">
        <span id="login-email-error" class="error-message"></span>
        <!-- <label>Password:</label>
        <input type="password" id="loginpwd" placeholder="Enter your password">
        <button type="button" class="showpwd" onclick="toggleLoginPassword()">Show</button>
        <span id="login-password-error" class="error-message"></span>
        <input type="checkbox" name="" id="checkbox"> -->
        <div class="password-box">
            <label>Password:</label>
            <div class="pwd-group">
                <input type="password" id="loginpwd" placeholder="Enter your password">
                <!-- <button type="button" onclick="togglePassword()">Show</button> -->
                <input type="checkbox" name="" id="checkpwd">
            </div>
            <span id="login-password-error" class="error-message"></span>
        </div>
        <div class="btn-container">
            <button class="register signinbtn" type="submit">Sign In</button>
        </div>
        <p>
            Don't have an account?
            <a href="index.html">Sign Up</a>
        </p>
    </form>
    <script src="js/login.js"></script>
</body>

</html>
